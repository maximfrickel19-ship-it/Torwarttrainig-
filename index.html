<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flying Keeper – Torwarttraining</title>
<style>
:root{
  --black:#0b0d0f;--charcoal:#15181b;--panel:#1d2125;--panel2:#24292e;
  --white:#f7f7f5;--muted:#aeb4b9;--line:#353b40;--accent:#ffffff;
  --success:#9be2aa;--warning:#ffe39a;--danger:#ffb0b0;
}
*{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;background:
  radial-gradient(circle at 50% -10%,#3b4044 0,#181b1e 34%,#0b0d0f 72%);
  color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,15,.94);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:12px 16px 14px}
.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{width:76px;height:76px;object-fit:cover;border-radius:16px;border:1px solid #555;filter:grayscale(1);background:#303234}
.brand h1{font-size:25px;letter-spacing:.5px;margin:0;font-weight:900;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.7px}
nav{max-width:900px;margin:12px auto 0;display:flex;background:#090b0d;border:1px solid var(--line);border-radius:13px;padding:4px}
nav button{flex:1;border:0;border-radius:9px;padding:11px;background:transparent;color:#aeb4b9;font-weight:800;font-size:15px;cursor:pointer}
nav button.active{background:var(--white);color:var(--black)}
main{max-width:900px;margin:auto;padding:18px 14px 40px}
.panel{background:linear-gradient(145deg,rgba(36,41,46,.98),rgba(25,29,33,.98));
  border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.25)}
.panel h2{font-size:18px;margin:0 0 13px}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#2a3035;color:var(--white);font-size:25px;cursor:pointer}
.week strong{text-align:center;font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px}
.day{border:1px solid transparent;background:#2a3035;color:#c9cdd0;border-radius:10px;padding:9px 2px;font-size:12px;cursor:pointer}
.day.active{background:var(--white);color:var(--black);font-weight:900}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.slot{min-height:78px;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:left;font-size:14px;font-weight:800;color:var(--white);cursor:pointer}
.slot.free{background:#243328;border-color:#48624e}.slot.pending{background:#3b3522;border-color:#645a38}
.slot.accepted{background:#27333a;border-color:#566a76}.slot.blocked{background:#292c2f;color:#777}
.time{font-size:15px}.hint{font-size:12px;font-weight:500;margin-top:5px;color:#aeb4b9}.empty{padding:16px 5px;color:#899197}
.request{border:1px solid var(--line);background:#20252a;border-radius:13px;padding:12px;margin:9px 0}
.request strong{font-size:16px}.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}
.ok{background:#5da96a;color:#08100a}.no{background:#533133;color:#ffd9d9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hide{display:none}.box{background:#191d21;border:1px solid var(--line);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 28px;box-shadow:0 -20px 50px #0008}
.close{float:right;border:0;background:#2b3035;color:white;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}
label{display:block;font-weight:800;margin:15px 0;color:#e9ebec}
input,textarea,select{display:block;width:100%;margin-top:6px;background:#101315;color:white;border:1px solid #454c52;border-radius:10px;padding:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#aaa}
.send{width:100%;border:0;border-radius:11px;background:var(--white);color:var(--black);padding:13px;font-weight:900;font-size:16px;cursor:pointer}
.toast{position:fixed;left:14px;right:14px;bottom:15px;background:#f7f7f5;color:#0b0d0f;padding:13px;border-radius:12px;text-align:center;z-index:30;display:none;font-weight:800}
.setting{border:1px solid var(--line);background:#20252a;border-radius:12px;padding:12px;margin:9px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{border:0;border-radius:9px;padding:10px;font-weight:800;background:#343b40;color:white;width:100%;margin-top:10px;cursor:pointer}
.danger{background:#533133}.notice{background:#252d33;border:1px solid #3d474f;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;color:#c8cdd0}
.kicker{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:#aeb4b9;font-weight:900;margin-bottom:5px}
@media(min-width:650px){.slots{grid-template-columns:repeat(3,1fr)}.modal{align-items:center}.box{border-radius:18px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.logo{width:64px;height:64px}.brand h1{font-size:20px}.brand p{font-size:11px}}
</style>
</head>

<main>

<div id="modal" class="modal hide"><div class="box"><button id="close" class="close">×</button><h2>Torwarttraining anfragen</h2><div id="chosen"></div>

<label>Dein Verein<input id="club" autocomplete="organization" placeholder="Name deines Vereins"></label>

<script>
const KEY="torwarttraining-termine-v4";let data=JSON.parse(localStorage.getItem(KEY)||'{"requests":[],"blocks":[],"nextId":1,"settings":{}}');data.settings=data.settings||{};
let role="player",selectedDate=new Date(),selectedStart=null,mondayDate=getMonday(new Date());const $=id=>document.getElementById(id);
function getMonday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);d.setHours(0,0,0,0);return d}
function keyDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function fmt(d,o){return d.toLocaleDateString("de-DE",o)}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2300)}
function daySettings(date){let s=data.settings[date]||(data.settings[date]={start:"09:00",end:"18:00",step:60,capacity:1,location:"",closed:false});if(s.location===undefined)s.location="";if(s.closed===undefined)s.closed=false;return s}
function slotsForDate(date){let s=daySettings(date),out=[],a=s.start.split(":").map(Number),b=s.end.split(":").map(Number),cur=a[0]*60+a[1],end=b[0]*60+b[1],step=Number(s.step)||60;while(cur<end){out.push({start:cur,end:Math.min(cur+step,end)});cur+=step}return out}
function timeText(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")+" Uhr"}
function block(date,start){return data.blocks.find(x=>x.date===date&&x.start===start)}
function req(date,start){return data.requests.filter(x=>x.date===date&&x.start===start)}
function render(){let end=new Date(mondayDate);end.setDate(end.getDate()+6);$("weekTitle").textContent=fmt(mondayDate,{day:"2-digit",month:"2-digit"})+" – "+fmt(end,{day:"2-digit",month:"2-digit",year:"numeric"});renderDays();renderSlots();renderScheduleSettings();renderRequests();renderNotifications()}
function renderDays(){let s="";for(let i=0;i<7;i++){let d=new Date(mondayDate);d.setDate(d.getDate()+i);s+=`<button class="day ${keyDate(d)===keyDate(selectedDate)?"active":""}" data-day="${i}">${fmt(d,{weekday:"short",day:"2-digit",month:"2-digit"})}</button>`}$("days").innerHTML=s;document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{let d=new Date(mondayDate);d.setDate(d.getDate()+Number(b.dataset.day));selectedDate=d;render()})}
function renderSlots(){
  let date=keyDate(selectedDate),settings=daySettings(date),s="";
  if(settings.closed){
    s=`<div class="notice"><strong>🚫 Dieser Tag ist komplett gesperrt.</strong>${settings.location?`<div>📍 ${settings.location}</div>`:""}${role==="trainer"?`<div class="hint">Du kannst den Tag unten wieder freigeben.</div>`:`<div class="hint">An diesem Tag können keine Termine angefragt werden.</div>`}</div>`;
    $("slots").innerHTML=s;
    return;
  }
  for(let sl of slotsForDate(date)){
    let r=req(date,sl.start),b=block(date,sl.start),cap=Number(settings.capacity)||1;
    let accepted=r.filter(x=>x.status==="accepted").length;
    let pending=r.filter(x=>x.status==="pending").length;
    let full=accepted>=cap;
    let cls=b?"blocked":full?"accepted":pending?"pending":"free";
    let title=b?"🚫 Nicht verfügbar":full?"✓ Ausgebucht":pending?"⏳ Anfrage läuft":"✓ Frei";
    let hint=role==="player"?(b?"Nicht verfügbar":full?"Ausgebucht":pending?"Anfrage läuft":"Tippen zum Anfragen"):(b?"Tippen zum Freigeben":`${accepted}/${cap} Trainer belegt · Tippen zum Blockieren`);
    s+=`<button class="slot ${cls}" data-start="${sl.start}"><div class="time">${timeText(sl.start)} – ${timeText(sl.end)}</div><div>${title}</div>${settings.location?`<div class="hint">📍 ${settings.location}</div>`:""}<div class="hint">${hint}</div></button>`;
  }
  $("slots").innerHTML=s;
  document.querySelectorAll(".slot").forEach(b=>b.onclick=()=>slotClick(date,Number(b.dataset.start)));
}
function slotClick(date,start){if(role==="trainer"){let b=block(date,start);if(b){data.blocks=data.blocks.filter(x=>!(x.date===date&&x.start===start));save();toast("Zeitraum wieder freigegeben.");render();return}if(req(date,start).some(x=>x.status==="accepted")){toast("Für diesen Zeitraum gibt es bereits genehmigte Buchungen.");return}let reason=prompt("Warum soll der Zeitraum blockiert werden?","Vereinstraining");if(reason!==null){data.blocks.push({date,start,reason:reason||"Nicht verfügbar"});save();render()}return}if(block(date,start)){toast("Dieser Zeitraum ist nicht verfügbar.");return}let cap=Number(daySettings(date).capacity)||1;if(req(date,start).filter(x=>x.status==="accepted").length>=cap){toast("Dieser Zeitraum ist ausgebucht.");return}selectedStart=start;let sl=slotsForDate(date).find(x=>x.start===start);$("chosen").textContent=fmt(selectedDate,{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})+" · "+timeText(start)+" – "+timeText(sl.end);$("modal").classList.remove("hide");setTimeout(()=>$("name").focus(),100)}
function renderScheduleSettings(){if(role!=="trainer")return;let date=keyDate(selectedDate),s=daySettings(date);$("scheduleSettings").innerHTML=`<div class="setting"><strong>${fmt(selectedDate,{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})}</strong><div class="grid"><label>Von<input id="setStart" type="time" value="${s.start}"></label><label>Bis<input id="setEnd" type="time" value="${s.end}"></label><label>Standort für diesen Tag<input id="setLocation" type="text" value="${s.location||""}" placeholder="z. B. Sportplatz Musterstadt"></label><label>Zeitraster<select id="setStep"><option value="60" ${s.step==60?"selected":""}>60 Minuten</option><option value="30" ${s.step==30?"selected":""}>30 Minuten</option></select></label><label>Trainer pro Zeitraum<input id="setCapacity" type="number" min="1" max="20" value="${s.capacity}"></label></div><button class="small" onclick="saveScheduleSettings()">Tagesplan speichern</button><button class="small" onclick="toggleDayClosed()">${s.closed?"🔓 Ganzen Tag freigeben":"🔒 Ganzen Tag sperren"}</button><div class="notice">Du kannst für jeden Tag andere Zeiten, einen eigenen Standort und eine andere Anzahl verfügbarer Trainer festlegen. Mit „Ganzen Tag sperren“ ist der komplette Tag für neue Anfragen geschlossen.</div></div>`}
window.saveScheduleSettings=()=>{let start=$("setStart").value,end=$("setEnd").value,location=$("setLocation").value.trim(),step=Number($("setStep").value),capacity=Math.max(1,Number($("setCapacity").value)||1);if(!start||!end||start>=end){toast("Bitte einen gültigen Zeitraum wählen.");return}data.settings[keyDate(selectedDate)]={start,end,step,capacity,location,closed:!!daySettings(keyDate(selectedDate)).closed};save();render();toast("Tagesplan gespeichert.")};
window.toggleDayClosed=()=>{let d=keyDate(selectedDate),s=daySettings(d);s.closed=!s.closed;data.settings[d]=s;save();render();toast(s.closed?"Ganzer Tag gesperrt.":"Ganzer Tag wieder freigegeben.")};
function renderRequests(){if(role!=="trainer")return;let a=[...data.requests].filter(x=>!x.trainerNotificationDeleted).sort((x,y)=>x.date.localeCompare(y.date)||x.start-y.start);$("requests").innerHTML=a.length?a.map(x=>`<div class="request"><strong>${x.player}</strong> · 🏟️ ${x.club||"Kein Verein"}<br>${fmt(new Date(x.date+"T12:00:00"),{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})} · ${timeText(x.start)} – ${timeText(x.end)}<br>${x.note||"Keine Nachricht"}<br><small>Status: ${statusText(x.status)}</small>${x.status==="pending"?`<div class="actions"><button class="ok" onclick="setStatus(${x.id},'accepted')">Genehmigen</button><button class="no" onclick="setStatus(${x.id},'rejected')">Absagen</button></div>`:""}${x.status==="accepted"?`<div class="actions"><button class="no" onclick="setStatus(${x.id},'cancelled')">Termin stornieren</button></div>`:""}<div class="actions"><button class="no" onclick="deleteTrainerNotification(${x.id})">Mitteilung löschen</button></div></div>`).join(""):"<div class='empty'>Keine Mitteilungen mehr vorhanden.</div>"}
function statusText(s){return s==="accepted"?"genehmigt":s==="rejected"?"abgesagt":s==="cancelled"?"storniert":"offen"}
window.setStatus=(id,status)=>{let x=data.requests.find(r=>r.id===id);if(x){x.status=status;x.updatedAt=Date.now();save();toast(status==="accepted"?"Termin genehmigt.":status==="cancelled"?"Termin storniert.":"Termin abgesagt.");render()}};
function renderNotifications(){if(role!=="player")return;let a=data.requests.filter(x=>x.status!=="pending"&&!x.notificationDeleted);$("notifications").innerHTML=a.length?a.slice().reverse().map(x=>`<div class="request"><strong>${x.status==="accepted"?"✅ Termin genehmigt":x.status==="rejected"?"❌ Termin abgesagt":"⚠️ Termin storniert"}</strong><br>${fmt(new Date(x.date+"T12:00:00"),{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})} · ${timeText(x.start)} – ${timeText(x.end)}<br>${x.player} · ${x.club}<div class="actions"><button class="no" onclick="deleteNotification(${x.id})">Mitteilung löschen</button></div></div>`).join(""):"<div class='empty'>Noch keine Terminmeldungen.</div>"}
window.deleteNotification=(id)=>{let i=data.requests.findIndex(r=>r.id===id);if(i!==-1){data.requests[i].notificationDeleted=true;save();renderNotifications();toast("Mitteilung gelöscht. Der Termin bleibt erhalten.")}}
window.deleteTrainerNotification=(id)=>{let i=data.requests.findIndex(r=>r.id===id);if(i!==-1){data.requests[i].trainerNotificationDeleted=true;save();renderRequests();toast("Mitteilung gelöscht. Der Termin bleibt erhalten.")}}
$("playerBtn").onclick=()=>{role="player";$("playerBtn").classList.add("active");$("trainerBtn").classList.remove("active");$("trainerPanel").style.display="none";$("notificationsPanel").style.display="block";render()};
$("trainerBtn").onclick=()=>{let pw=prompt("Trainer-Passwort:");if(pw!=="flyingkeeperteam"){toast("Falsches Passwort.");return}role="trainer";$("trainerBtn").classList.add("active");$("playerBtn").classList.remove("active");$("trainerPanel").style.display="block";$("notificationsPanel").style.display="none";render()};
$("prev").onclick=()=>{mondayDate.setDate(mondayDate.getDate()-7);selectedDate=new Date(mondayDate);render()};
$("next").onclick=()=>{mondayDate.setDate(mondayDate.getDate()+7);selectedDate=new Date(mondayDate);render()};
$("close").onclick=()=>$("modal").classList.add("hide");
$("send").onclick=()=>{let name=$("name").value.trim(),club=$("club").value.trim();if(!name||!club){toast("Bitte Name und Verein eingeben.");return}let sl=slotsForDate(keyDate(selectedDate)).find(x=>x.start===selectedStart);data.requests.push({id:data.nextId++,date:keyDate(selectedDate),start:selectedStart,end:sl.end,player:name,club,note:$("note").value.trim(),status:"pending",createdAt:Date.now()});save();$("name").value="";$("club").value="";$("note").value="";$("modal").classList.add("hide");render();toast("Anfrage wurde gesendet.")};
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
